name: Cancel stale Pages workflow

on:
  push:
    paths:
      - ".github/workflows/cancel-stale-run.yml"

permissions:
  actions: write

jobs:
  cancel-stale-run:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Force cancel the superseded queued run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 45 --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --write-out "\nCancellation HTTP %{http_code}\n" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/42089352626/force-cancel"
